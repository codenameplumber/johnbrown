<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Orders | JJ Bowen admin</title>
  <meta name="robots" content="noindex">
</head>
<body data-base="../">
  <p>Opening orders…</p>
  <script src="../assets/js/seed.js?v=7"></script>
  <script src="../assets/js/store.js?v=7"></script>
  <script>
  /* Old link: send it to Printing orders or Shop orders. */
  (async function () {
    const qs = new URLSearchParams(location.search);
    const ref = qs.get('ref');
    const o = ref && await JB.store.getOrder(ref);
    const page = o && !o.items.some((i) => i.type === 'print') ? 'shop-orders.html' : 'print-orders.html';
    location.replace(page + location.search);
  })();
  </script>
</body>
</html>
