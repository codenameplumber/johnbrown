<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shop orders | JJ Bowen admin</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="../assets/logo/jj-mark.svg?v=2" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Manrope:wght@400;500;600;700;800&family=Anton&family=Bebas+Neue&family=Pacifico&family=Permanent+Marker&family=Playfair+Display:wght@700&family=Montserrat:wght@800&family=Oswald:wght@600&family=Lobster&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
  <link rel="stylesheet" href="../assets/css/site.css?v=7">
  <link rel="stylesheet" href="../assets/css/admin.css?v=7">
</head>
<body class="admin" data-base="../" data-admin="shop-orders" data-kind="shop" data-title="Shop orders">
  <div class="adm">
    <aside class="adm-side" id="admSide"></aside>
    <div class="adm-scrim" id="admScrim"></div>
    <div class="adm-main">
      <header class="adm-top" id="admTop"></header>
      <main class="adm-content">
        <section class="card">
          <div class="card-head">
            <div><h2>Shop orders</h2><p>Ready-made clothes from the shop: suits, shirts, polos, caps and more.</p></div>
          </div>
          <div class="seg-tabs" id="statusTabs" role="group" aria-label="Filter by status" style="margin-bottom:14px"></div>
          <div class="filters">
            <label class="search"><span class="sr-only">Search orders</span><i class="ti ti-search" aria-hidden="true"></i><input class="input" type="search" id="q" placeholder="Order, name, phone or item"></label>
            <label class="sr-only" for="when">Date</label>
            <select class="select" id="when"><option value="">Any date</option><option value="1">Today</option><option value="7">Last 7 days</option><option value="30">Last 30 days</option></select>
            <label class="switch" style="margin-left:auto"><input type="checkbox" id="hideSample"> Hide sample orders</label>
          </div>
          <div class="dt" id="table"></div>
          <p class="muted" id="foot" style="font-size:.85rem;margin:12px 0 0"></p>
        </section>
      </main>
    </div>
  </div>

  <dialog class="modal wide" id="dlg" aria-labelledby="dlgTitle">
    <div class="modal-head"><h2 id="dlgTitle">Order</h2><button class="icon-btn" type="button" data-close aria-label="Close"><i class="ti ti-x" aria-hidden="true"></i></button></div>
    <div class="modal-body" id="dlgBody"></div>
  </dialog>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.1/fabric.min.js"></script>
  <script src="../assets/js/seed.js?v=7"></script>
  <script src="../assets/js/store.js?v=7"></script>
  <script src="../assets/js/garments.js?v=7"></script>
  <script src="../assets/js/design-render.js?v=7"></script>
  <script src="../assets/js/admin/common.js?v=7"></script>
  <script src="../assets/js/admin/orders.js?v=7"></script>
</body>
</html>
