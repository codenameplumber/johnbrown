<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Your order | John Brown Art &amp; Design</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="assets/logo/jb-mark.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
  <link rel="stylesheet" href="assets/css/site.css?v=3">
  <link rel="stylesheet" href="assets/css/pages.css?v=3">
</head>
<body data-page="order">
  <div id="site-header"></div>
  <main id="main" class="section section-grey"><div class="wrap" id="root"></div></main>
  <div id="site-footer"></div>
  <script src="assets/js/seed.js?v=3"></script>
  <script src="assets/js/store.js?v=3"></script>
  <script src="assets/js/ui.js?v=3"></script>
  <script>
  (async function () {
    const JB = window.JB, esc = JB.esc;
    const qs = new URLSearchParams(location.search);
    const ref = qs.get('ref');
    const S = await JB.store.getSettings();
    const o = ref && await JB.store.getOrder(ref);
    const root = document.getElementById('root');
    if (!o) {
      root.innerHTML = `<div class="order-card"><div class="empty" style="border:none"><i class="ti ti-file-search" aria-hidden="true"></i><h3>Order not found on this device</h3><p class="muted">Order details are saved on the device that placed the order. Message us on WhatsApp with your order number and we will help.</p><a class="btn btn-wa" href="${JB.waLink('Hello, I am asking about order ' + (ref || ''))}" target="_blank" rel="noopener"><i class="ti ti-brand-whatsapp" aria-hidden="true"></i> Message us</a></div></div>`;
      return;
    }
    const STATUS = { new: 'Waiting for us to confirm', confirmed: 'Confirmed, waiting for payment', paid: 'Paid', in_production: 'Being made', ready: 'Ready', delivered: 'Delivered', cancelled: 'Cancelled' };
    const sent = qs.get('sent');
    const items = o.items.map((it) => {
      const lines = JB.itemLines(it);
      const imgs = it.type === 'print'
        ? Object.values(it.sides).map((s) => s.preview ? `<img class="mock" src="${s.preview}" alt="Design preview">` : '').join('')
        : `<img src="${JB.asset(it.image)}" alt="">`;
      return `<div class="oitem">${imgs}<div><strong>${esc(lines[0])}</strong>${lines.slice(1).map((l) => `<span>${esc(l)}</span><br>`).join('')}</div><strong>${JB.money(it.lineTotal)}</strong></div>`;
    }).join('');
    root.innerHTML = `
<div class="order-card">
  <div class="order-head">
    <span class="order-ok"><i class="ti ti-${o.status === 'cancelled' ? 'x' : 'check'}" aria-hidden="true"></i></span>
    <div>
      <div class="muted" style="font-weight:700">${sent ? 'Order saved. Finish sending it on WhatsApp.' : 'Order status: ' + esc(STATUS[o.status] || o.status)}</div>
      <div class="order-ref">${esc(o.ref)}</div>
    </div>
  </div>
  ${sent ? `<div class="notice" style="margin-bottom:1rem"><i class="ti ti-info-circle" aria-hidden="true"></i><div>WhatsApp should have opened with your order typed out. Press send there. If it did not open, use the green button below.</div></div>` : ''}
  <a class="btn btn-wa btn-block" href="${JB.waLink(JB.orderMessage(o, S))}" target="_blank" rel="noopener"><i class="ti ti-brand-whatsapp" aria-hidden="true"></i> ${sent ? 'Open WhatsApp again' : 'Message us about this order'}</a>
  <div class="order-items">${items}</div>
  <div class="sum-row"><span>Subtotal</span><span>${JB.money((o.printTotal || 0) + (o.shopTotal || 0))}</span></div>
  ${o.discount ? `<div class="sum-row save"><span>Bulk saving included</span><span>${JB.money(o.discount)}</span></div>` : ''}
  <div class="sum-row"><span>${o.fulfilment === 'delivery' ? 'Shipping' : 'Local pickup'}</span><span>${o.fee ? JB.money(o.fee) : 'Free'}</span></div>
  ${o.tax ? `<div class="sum-row"><span>Sales tax (${o.taxRate}%)</span><span>${JB.money(o.tax)}</span></div>` : ''}
  <div class="sum-row total"><span>Total</span><span>${JB.money(o.total)}</span></div>
  ${o.address ? `<p class="muted" style="font-size:.88rem;margin:.6rem 0 0"><i class="ti ti-map-pin" aria-hidden="true"></i> Ship to: ${esc(o.address)}</p>` : ''}
  <div class="steps-next">
    <div><i class="ti ti-message-check" aria-hidden="true"></i><strong>1. We confirm</strong>We check your design, sizes and delivery on WhatsApp.</div>
    <div><i class="ti ti-credit-card" aria-hidden="true"></i><strong>2. You pay</strong>We send you payment options. Work starts once your payment clears.</div>
    <div><i class="ti ti-package" aria-hidden="true"></i><strong>3. We make it</strong>We let you know when it ships or is ready for pickup.</div>
  </div>
  <div class="hero-ctas" style="margin-top:1.4rem"><a class="btn btn-line" href="shop.html">Keep shopping</a><a class="btn btn-dark" href="studio.html">Design another</a></div>
</div>`;
  })();
  </script>
</body>
</html>
